spring.application.name=nefsiti
server.port=8080

# Valeurs propres au poste (mot de passe BD, secret JWT...) : fichier non versionne
# Copier application-local.properties.example -> application-local.properties
spring.config.import=optional:classpath:application-local.properties

# ===== Base de donnees PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nafsiti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== JWT =====
# Cle HMAC en Base64 (>= 256 bits). Valeur de DEVELOPPEMENT uniquement :
# a remplacer dans application-local.properties ou via la variable JWT_SECRET.
app.jwt.secret=${JWT_SECRET:ZGV2LW5hZnNpdGktY2xlLWp3dC1hLXJlbXBsYWNlci1lbi1wcm9kdWN0aW9uLTIwMjY=}
# Duree de validite du token en millisecondes (24 h)
app.jwt.expiration-ms=86400000

# ===== CORS (front Angular) =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ===== Administrateur cree au demarrage s'il n'en existe aucun =====
app.admin.email=${ADMIN_EMAIL:admin@nafsiti.tn}
app.admin.password=${ADMIN_PASSWORD:Admin2026}
